[project]
name = "lectureloop-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.118,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
 "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
 "argon2-cffi>=23.1", "python-multipart>=0.0.20", "email-validator>=2.2",
 "httpx>=0.28,<1", "pgvector>=0.4,<1", "pymupdf>=1.25,<2", "python-magic>=0.4",
 "websockets>=15,<16", "itsdangerous>=2.2", "pytest>=8,<10", "ruff>=0.11,<1"
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 120
