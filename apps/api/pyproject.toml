[project]
name = "lectureloop-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.118,<1", "uvicorn[standard]>=0.34,<0.54", "sqlalchemy>=2.0,<3",
 "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
 "argon2-cffi>=23.1", "python-multipart>=0.0.20", "email-validator>=2.2",
 "httpx>=0.28,<1", "pgvector>=0.4,<1", "python-magic>=0.4",
 "websockets>=15,<16", "itsdangerous>=2.2", "pytest>=8,<10", "ruff>=0.11,<1", "semchunk==4.1.1", "tiktoken==0.12.0", "reportlab==4.4.10", "pillow==13.0.0", "snowballstemmer==3.1.1"
]
[project.optional-dependencies]
ocr = ["paddleocr[doc-parser]==3.7.0", "paddlex==3.7.0", "pyyaml==6.0.2", "onnxruntime==1.31.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 120
